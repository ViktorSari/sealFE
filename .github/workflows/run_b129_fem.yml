name: B129 FEBio Stage 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "models/b129_stage1/**"
      - "requirements.txt"
      - ".github/workflows/run_b129_fem.yml"

permissions:
  contents: read

jobs:
  b129-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sealFE
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate FEBio input
        run: |
          python -m py_compile models/b129_stage1/generate_model.py
          python models/b129_stage1/generate_model.py
          test -s models/b129_stage1/B129_stage1_normal_contact.feb
          grep -q 'linear_solver type="skyline"' models/b129_stage1/B129_stage1_normal_contact.feb

      - name: Clone FEBio 4.13
        run: |
          git clone --depth 1 --branch v4.13 https://github.com/febiosoftware/FEBio.git .febio-src
          # Diagnostic build: print up to 60 negative-Jacobian locations.
          sed -i 's/int NegativeJacobian::m_maxout = 0;/int NegativeJacobian::m_maxout = 60;/' .febio-src/FECore/FEException.cpp
          grep -q 'int NegativeJacobian::m_maxout = 60;' .febio-src/FECore/FEException.cpp

      - name: Restore FEBio build cache
        id: febio-cache
        uses: actions/cache/restore@v4
        with:
          path: .febio-build
          key: febio-4.13-ubuntu-x64-no-external-solvers-negjac60-v1

      - name: Configure FEBio without external linear solvers
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .febio-src -B .febio-build             -DCMAKE_BUILD_TYPE=Release             -DUSE_MKL=OFF             -DUSE_FFTW=OFF             -DUSE_HYPRE=OFF             -DUSE_LEVMAR=OFF             -DUSE_MMG=OFF             -DUSE_NLOPT=OFF             -DUSE_SUPERLU_MT=OFF             -DUSE_ZLIB=OFF             -DUSE_STATIC_STDLIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fopenmp" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fopenmp"

      - name: Build FEBio
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: |
          cmake --build .febio-build --target febio4 --parallel 2
          test -x ./.febio-build/bin/febio4

      - name: Save FEBio build cache
        if: steps.febio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .febio-build
          key: febio-4.13-ubuntu-x64-no-external-solvers-negjac60-v1

      - name: Verify FEBio executable
        run: test -x .febio-build/bin/febio4

      - name: Run B129 nonlinear contact solve
        id: solve
        continue-on-error: true
        run: |
          mkdir -p results
          cd models/b129_stage1
          "${GITHUB_WORKSPACE}/.febio-build/bin/febio4" \
            -i B129_stage1_normal_contact.feb \
            > "${GITHUB_WORKSPACE}/results/febio_stdout.txt" 2>&1

      - name: Collect FEM outputs
        if: always()
        run: |
          mkdir -p results
          cp models/b129_stage1/B129_stage1_normal_contact.feb results/ 2>/dev/null || true
          find models/b129_stage1 -maxdepth 1 -type f \( -name "*.xplt" -o -name "*.log" -o -name "*.txt" \)             -exec cp {} results/ \; || true
          echo "solve_outcome=${{ steps.solve.outcome }}" > results/workflow_status.txt

      - name: Report last converged B129 state
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          model_text = Path("models/b129_stage1/generate_model.py").read_text()
          ramp_match = re.search(r"^MAX_INDENTATION_UM\s*=\s*([\d.]+)", model_text, re.MULTILINE)
          if not ramp_match:
              raise RuntimeError("Could not read MAX_INDENTATION_UM from generate_model.py")
          ramp_um = float(ramp_match.group(1))
          print("target_indentation_um=", ramp_um)
          log = Path("results/B129_stage1_normal_contact.log")
          if log.exists():
              data = log.read_text(errors="replace")
              converged = re.findall(r"converged at time\s*:\s*([\d.eE+-]+)", data)
              failed = re.findall(r"failed to converge at time\s*:\s*([\d.eE+-]+)", data)
              jac = re.findall(r"Negative jacobian was detected at element\s*(\d+)", data)
              print("last_converged_time=", converged[-1] if converged else "none")
              print("last_converged_indentation_um=", ramp_um * float(converged[-1]) if converged else "none")
              print("last_failed_time=", failed[-1] if failed else "none")
              print("negative_jacobian_events=", len(jac))
              print("last_negative_jacobian_element=", jac[-1] if jac else "none")
          PY
          if test -s results/B129_stage1_normal_contact.xplt; then
            RAMP_UM=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("models/b129_stage1/generate_model.py").read_text()
          m = re.search(r"^MAX_INDENTATION_UM\s*=\s*([\d.]+)", text, re.MULTILINE)
          if not m:
              raise RuntimeError("Could not read MAX_INDENTATION_UM")
          print(m.group(1))
          PY
            )
            python analyze_b129_xplt.py results/B129_stage1_normal_contact.xplt \
              --ramp-um "$RAMP_UM" --output results/B129_pressure_history.csv
            tail -n 1 results/B129_pressure_history.csv
          fi

      - name: Upload B129 pressure history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B129-pressure-history
          path: results/B129_pressure_history.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload FEBio results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B129-stage1-FEBio-results
          path: results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if FEBio solve failed
        if: steps.solve.outcome == 'failure'
        run: exit 1
