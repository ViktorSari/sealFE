name: B129 volumetric augmentation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b129_volume_augmentation_validation.yml"

permissions:
  contents: read

concurrency:
  group: b129-volume-augmentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: baseline_K850_noaug
            k_mpa: "850.0"
            augment: "0"
          - case: aug_K850
            k_mpa: "850.0"
            augment: "1"
          - case: aug_K5000
            k_mpa: "5000.0"
            augment: "1"

    env:
      B129_BULK_MODULUS_MPA: ${{ matrix.k_mpa }}
      B129_VOLUME_AUGMENT: ${{ matrix.augment }}
      B129_VOLUME_AUGTOL: "0.01"
      B129_RUBBER_HEIGHT_UM: "100.0"
      B129_MAX_INDENTATION_UM: "4.2"
      B129_DISPLACEMENT_INCREMENT_UM: "0.1"
      B129_INITIAL_GAP_UM: "-0.001"
      B129_CONTACT_PENALTY_MPA_PER_UM: "0.30"
      B129_CONTACT_SEARCH_RADIUS_UM: "5.0"
      B129_SIDE_BC_MODE: "both_sides"
      B129_SOLVER_DTOL: "0.01"
      B129_SOLVER_ETOL: "0.01"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate reference-copy model
        run: |
          mkdir -p results
          python models/b129_stage1/generate_model.py
          test -s models/b129_stage1/B129_stage1_normal_contact.feb
          grep -q 'linear_solver type="skyline"' models/b129_stage1/B129_stage1_normal_contact.feb
          grep -q '<var type="relative volume"' models/b129_stage1/B129_stage1_normal_contact.feb
          if [ "${{ matrix.augment }}" = "1" ]; then
            grep -q '<laugon>1</laugon><atol>0.01</atol>' models/b129_stage1/B129_stage1_normal_contact.feb
          fi
          {
            echo "case=${{ matrix.case }}"
            echo "K_MPa=${{ matrix.k_mpa }}"
            echo "volume_augment=${{ matrix.augment }}"
            echo "volume_augtol=0.01"
            echo "mesh=reference"
            echo "contact=reference"
            echo "material=MR2 C10=0.348 C01=0.886 MPa"
          } > results/augmentation_case.txt

      - name: Clone FEBio 4.13
        run: |
          git clone --depth 1 --branch v4.13 https://github.com/febiosoftware/FEBio.git .febio-src
          sed -i 's/int NegativeJacobian::m_maxout = 0;/int NegativeJacobian::m_maxout = 60;/' .febio-src/FECore/FEException.cpp

      - name: Restore FEBio build cache
        id: febio-cache
        uses: actions/cache/restore@v4
        with:
          path: .febio-build
          key: febio-4.13-ubuntu-x64-no-external-solvers-negjac60-v1

      - name: Configure FEBio
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .febio-src -B .febio-build -DCMAKE_BUILD_TYPE=Release -DUSE_MKL=OFF -DUSE_FFTW=OFF -DUSE_HYPRE=OFF -DUSE_LEVMAR=OFF -DUSE_MMG=OFF -DUSE_NLOPT=OFF -DUSE_SUPERLU_MT=OFF -DUSE_ZLIB=OFF -DUSE_STATIC_STDLIBS=OFF -DCMAKE_EXE_LINKER_FLAGS="-fopenmp" -DCMAKE_SHARED_LINKER_FLAGS="-fopenmp"

      - name: Build FEBio
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: cmake --build .febio-build --target febio4 --parallel 2

      - name: Run FEBio
        id: solve
        continue-on-error: true
        run: |
          cd models/b129_stage1
          "${{ github.workspace }}/.febio-build/bin/febio4" -i B129_stage1_normal_contact.feb > "${{ github.workspace }}/results/febio_stdout.txt" 2>&1

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p results
          cp models/b129_stage1/B129_stage1_normal_contact.feb results/ 2>/dev/null || true
          find models/b129_stage1 -maxdepth 1 -type f \( -name "*.xplt" -o -name "*.log" -o -name "*.txt" \) -exec cp {} results/ \; || true
          echo "solve_outcome=${{ steps.solve.outcome }}" >> results/augmentation_case.txt

      - name: Postprocess
        if: always()
        run: |
          if test -s results/B129_stage1_normal_contact.xplt; then
            python models/b129_stage1/postprocess_results.py results/B129_stage1_normal_contact.xplt results/B129_stage1_normal_contact.feb --ramp-um 4.2 --output-dir results
          else
            echo "No XPLT produced" >&2
            exit 1
          fi

      - name: Classify termination
        if: always()
        run: |
          if [ "${{ steps.solve.outcome }}" = "success" ]; then
            exit 0
          fi
          if test -s results/B129_stage1_normal_contact.xplt && test -s results/B129_stage1_normal_contact.log && grep -qi "Negative jacobian" results/B129_stage1_normal_contact.log; then
            exit 0
          fi
          exit 1

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B129-volaug-${{ matrix.case }}
          path: results/
          if-no-files-found: error
          retention-days: 14
