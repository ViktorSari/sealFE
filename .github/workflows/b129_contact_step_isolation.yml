name: B129 contact step isolation trial

on:
  workflow_dispatch:
  push:
    branches: [codex/b129-contact-closure]
    paths:
      - '.github/workflows/b129_contact_step_isolation.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {case: p030_aug010_step050, penalty: '0.30', increment: '0.05'}
          - {case: p040_aug010_step050, penalty: '0.40', increment: '0.05'}
    env:
      B129_SURFACE_DZ_UM: '0.75'
      B129_X_SUBDIV: '1'
      B129_CONTACT_PENALTY_MPA_PER_UM: ${{ matrix.penalty }}
      B129_CONTACT_AUG_TOL: '0.01'
      B129_CONTACT_MAX_AUG: '25'
      B129_BULK_MODULUS_MPA: '2000.0'
      B129_VOLUME_AUGMENT: '1'
      B129_VOLUME_AUGTOL: '0.01'
      B129_RUBBER_HEIGHT_UM: '100.0'
      B129_MAX_INDENTATION_UM: '3.5'
      B129_DISPLACEMENT_INCREMENT_UM: ${{ matrix.increment }}
      B129_INITIAL_GAP_UM: '-0.001'
      B129_CONTACT_SEARCH_RADIUS_UM: '5.0'
      B129_SIDE_BC_MODE: both_sides
      B129_SOLVER_DTOL: '0.01'
      B129_SOLVER_ETOL: '0.01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate case
        run: |
          mkdir -p results
          python studies/b129_mesh_sensitivity.py
          test -s models/b129_stage1/B129_stage1_normal_contact.feb
          grep -q '<tolerance>0.01</tolerance>' models/b129_stage1/B129_stage1_normal_contact.feb
          grep -q '<maxaug>25</maxaug>' models/b129_stage1/B129_stage1_normal_contact.feb
          env | grep '^B129_' | sort > results/case_settings.txt
      - name: Clone FEBio 4.13
        run: |
          git clone --depth 1 --branch v4.13 https://github.com/febiosoftware/FEBio.git .febio-src
          sed -i 's/int NegativeJacobian::m_maxout = 0;/int NegativeJacobian::m_maxout = 60;/' .febio-src/FECore/FEException.cpp
      - name: Restore FEBio build cache
        id: febio-cache
        uses: actions/cache/restore@v4
        with:
          path: .febio-build
          key: febio-4.13-ubuntu-x64-no-external-solvers-negjac60-v1
      - name: Configure FEBio
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .febio-src -B .febio-build -DCMAKE_BUILD_TYPE=Release -DUSE_MKL=OFF -DUSE_FFTW=OFF -DUSE_HYPRE=OFF -DUSE_LEVMAR=OFF -DUSE_MMG=OFF -DUSE_NLOPT=OFF -DUSE_SUPERLU_MT=OFF -DUSE_ZLIB=OFF -DUSE_STATIC_STDLIBS=OFF -DCMAKE_EXE_LINKER_FLAGS='-fopenmp' -DCMAKE_SHARED_LINKER_FLAGS='-fopenmp'
      - name: Build FEBio
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: cmake --build .febio-build --target febio4 --parallel 2
      - name: Run FEBio
        id: solve
        continue-on-error: true
        run: |
          cd models/b129_stage1
          '${{ github.workspace }}/.febio-build/bin/febio4' -i B129_stage1_normal_contact.feb > '${{ github.workspace }}/results/febio_stdout.txt' 2>&1
      - name: Analyze converged states
        if: always()
        run: |
          cp models/b129_stage1/B129_stage1_normal_contact.feb results/ 2>/dev/null || true
          find models/b129_stage1 -maxdepth 1 -type f \( -name '*.xplt' -o -name '*.log' \) -exec cp {} results/ \; || true
          echo 'solve_outcome=${{ steps.solve.outcome }}' >> results/case_settings.txt
          python models/b129_stage1/active_contact_reader.py results/B129_stage1_normal_contact.xplt results/B129_stage1_normal_contact.feb --ramp-um 3.5 --output-dir results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B129-contact-step-isolation-${{ matrix.case }}
          path: results/
          if-no-files-found: error
          retention-days: 14
