name: R07 alternate-section low-overlap contact trial

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/r07-ch-dense-peaks]

permissions:
  contents: read

jobs:
  pilot:
    name: pilot ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: r13000_35_235_p040
            side: both_sides
            bulk: '2000.0'
            dz: '0.75'
            x_subdiv: '1'
            penalty: '0.40'
            step: '0.05'
            augtol: '0.01'
            lsmin: '0.001'
            lsiter: '10'
            enforcement: AUGLAG
            smooth_aug: '0'
            sigma: '0'
          - case_id: r13000_35_235_p030
            side: both_sides
            bulk: '2000.0'
            dz: '0.75'
            x_subdiv: '1'
            penalty: '0.30'
            step: '0.05'
            augtol: '0.01'
            lsmin: '0.001'
            lsiter: '10'
            enforcement: AUGLAG
            smooth_aug: '0'
            sigma: '0'
    env:
      B129_SURFACE_DZ_UM: ${{ matrix.dz }}
      B129_X_SUBDIV: ${{ matrix.x_subdiv }}
      B129_CONTACT_PENALTY_MPA_PER_UM: ${{ matrix.penalty }}
      B129_CONTACT_AUG_TOL: ${{ matrix.augtol }}
      B129_CONTACT_MAX_AUG: '50'
      B129_BULK_MODULUS_MPA: ${{ matrix.bulk }}
      B129_VOLUME_AUGMENT: '1'
      B129_VOLUME_AUGTOL: '0.01'
      B129_RUBBER_HEIGHT_UM: '100.0'
      B129_MAX_INDENTATION_UM: '5.5'
      B129_DISPLACEMENT_INCREMENT_UM: ${{ matrix.step }}
      B129_INITIAL_GAP_UM: '-0.001'
      B129_CONTACT_SEARCH_RADIUS_UM: '5.0'
      B129_SIDE_BC_MODE: ${{ matrix.side }}
      B129_SOLVER_DTOL: '0.01'
      B129_SOLVER_ETOL: '0.01'
      B129_SOLVER_LS_CHECK_JACOBIANS: '0'
      B129_SOLVER_LSMIN: ${{ matrix.lsmin }}
      B129_SOLVER_LSITER: ${{ matrix.lsiter }}
      B129_CONTACT_FORMULATION: sliding-elastic
      B129_CONTACT_ENFORCEMENT: ${{ matrix.enforcement }}
      B129_CONTACT_SMOOTH_AUG: ${{ matrix.smooth_aug }}
      B129_PROFILE_GAUSSIAN_SIGMA_SAMPLES: ${{ matrix.sigma }}
      B129_LINEAR_SOLVER: skyline
      B129_UNSYMMETRIC_CONTACT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate measured R07 chamfer model
        run: |
          mkdir -p results
          python - <<'PY'
          from pathlib import Path
          from studies import b129_mesh_sensitivity as mesh
          mesh.gm.PROFILE_CSV = Path('models/b129_stage1/07R13000_35_235um_profile.csv')
          mesh.main()
          PY
          test -s models/b129_stage1/B129_stage1_normal_contact.feb
          cp models/b129_stage1/07R13000_35_235um_profile.csv results/
          cp models/b129_stage1/used_profile.csv results/
          env | grep '^B129_' | sort > results/case_settings.txt
          printf '07R13000.TXT, measured 35–235 um; 9 peaks at prominence 0.3 um and 4 um minimum distance in inner 190 um; original z retained; check full projected contact and geometric overlap.\n' >> results/case_settings.txt
      - name: Clone FEBio 4.13
        run: |
          git clone --depth 1 --branch v4.13 https://github.com/febiosoftware/FEBio.git .febio-src
          sed -i 's/int NegativeJacobian::m_maxout = 0;/int NegativeJacobian::m_maxout = 60;/' .febio-src/FECore/FEException.cpp
      - name: Restore tested FEBio build
        id: febio-cache
        uses: actions/cache/restore@v4
        with:
          path: .febio-build
          key: febio-4.13-ubuntu-x64-no-external-solvers-negjac60-v1
      - name: Configure FEBio on cache miss
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .febio-src -B .febio-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_MKL=OFF -DUSE_FFTW=OFF -DUSE_HYPRE=OFF \
            -DUSE_LEVMAR=OFF -DUSE_MMG=OFF -DUSE_NLOPT=OFF \
            -DUSE_SUPERLU_MT=OFF -DUSE_ZLIB=OFF -DUSE_STATIC_STDLIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS='-fopenmp' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fopenmp'
      - name: Build FEBio on cache miss
        if: steps.febio-cache.outputs.cache-hit != 'true'
        run: cmake --build .febio-build --target febio4 --parallel 2
      - name: Save FEBio build cache
        if: steps.febio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .febio-build
          key: febio-4.13-ubuntu-x64-no-external-solvers-negjac60-v1
      - name: Verify FEBio executable
        run: test -x .febio-build/bin/febio4
      - name: Run FEBio
        id: solve
        continue-on-error: true
        run: |
          cd models/b129_stage1
          '${{ github.workspace }}/.febio-build/bin/febio4' -i B129_stage1_normal_contact.feb > '${{ github.workspace }}/results/febio_stdout.txt' 2>&1
      - name: Extract converged states
        if: always()
        run: |
          cp models/b129_stage1/B129_stage1_normal_contact.feb results/ 2>/dev/null || true
          find models/b129_stage1 -maxdepth 1 -type f \( -name '*.xplt' -o -name '*.log' \) -exec cp {} results/ \; || true
          echo 'solve_outcome=${{ steps.solve.outcome }}' >> results/case_settings.txt
          python models/b129_stage1/active_contact_reader.py results/B129_stage1_normal_contact.xplt results/B129_stage1_normal_contact.feb --ramp-um 5.5 --output-dir results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R07_CH_alternate-${{ matrix.case_id }}
          path: results/
          if-no-files-found: error
          retention-days: 14
